<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Spectrum Lab</title><link rel="stylesheet" href="/static/style.css"></head><body>
<main><header><div class="eyebrow">LOCAL AUDIO INTELLIGENCE</div><h1>Voice Spectrum <span>Lab</span></h1><p>음성의 시간·주파수·음높이를 한 화면에서 탐색하세요.</p></header>
<section class="panel"><label class="drop" id="drop"><input id="file" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav"><div class="upload-icon">↥</div><strong>오디오 파일을 선택하거나 끌어 놓으세요</strong><small>MP3, WAV · 최대 180초 분석</small><button type="button" id="choose">파일 선택</button></label><div id="status" class="status">분석할 음성 파일을 기다리는 중</div><audio id="player" controls hidden></audio></section>
<section id="result" hidden><div class="meta"><div><small>ANALYSIS RESULT</small><h2 id="name">—</h2></div><div class="stats"><span><b id="duration">—</b> sec</span><span><b id="rate">—</b> Hz</span></div></div><div class="grid"><article><h3>Waveform</h3><img id="waveform"></article><article><h3>Spectrogram</h3><img id="spectrogram"></article><article class="wide"><h3>Pitch / Fundamental frequency</h3><img id="pitch"></article></div></section></main><script src="/static/app.js"></script></body></html>

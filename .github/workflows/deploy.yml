name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Run Docker Container
        run: |
          DOCKER_BIN=$(which docker || echo "/usr/local/bin/docker")
          $DOCKER_BIN build -t audio-app .
          $DOCKER_BIN stop audio-container 2>/dev/null || true
          $DOCKER_BIN rm audio-container 2>/dev/null || true
          $DOCKER_BIN run -d -p 8000:8000 --name audio-container audio-app
